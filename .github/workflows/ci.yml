name: Inventory CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inventory_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INVENTORY_DATABASE_URL: postgresql://inventory_test:ci-only-password@localhost:5432/inventory_test
      BETTER_AUTH_SECRET: ci-only-secret-for-isolated-tests-not-production
      BETTER_AUTH_URL: http://localhost:3030
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node scripts/seed-test.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/verify-print.ts
        env:
          CHROMIUM_SANDBOX: "off"
      - run: npx playwright test
